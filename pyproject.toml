# Open Volume Renderer (OVR) - Python package metadata + scikit-build-core
# wheel-build configuration. The actual C++/CUDA build is driven by the
# top-level CMakeLists.txt; only the Python tier flags + wheel-bundling
# rules live here. End-user install instructions: README.md. Full wheel-
# build internals (component scoping, RPATH, loader-error helper): DEV.md.
[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "ovrpy"
version = "0.1.0"
description = "Open Volume Renderer (OVR) - CUDA + OSPRay volume rendering bindings"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-cov>=4",
    "numpy>=1.24",
    "pillow>=10",
    "scikit-image>=0.21",
]

[project.scripts]
ovrpy-render = "ovrpy.render:main"
# C++ apps bundled inside <wheel>/ovrpy/bin/ and re-exposed via thin
# Python entry-point shims (see python/ovrpy/_apps.py) so they land on
# $PATH after `pip install` without needing absolute-path RPATHs.
renderapp    = "ovrpy._apps:renderapp"
renderbatch  = "ovrpy._apps:renderbatch"

[project.urls]
Homepage = "https://github.com/wilsonCernWq/open-volume-renderer"

# ---------------------------------------------------------------------------
# scikit-build-core configuration
#
# `pip install .` (or `pip install -e .`) drives the existing top-level
# CMakeLists.txt with the wheel-targeted flags: bindings on, apps off,
# tests off. OpenGL stays on so interactive rendering is reachable from
# Python; the matching imgui/glad shared libs are bundled into the wheel
# (see python/CMakeLists.txt). The `scripts/build.sh` cmake-only flow is
# unaffected and continues to share the same `build/` layout.
# ---------------------------------------------------------------------------
[tool.scikit-build]
cmake.version    = ">=3.24"
cmake.source-dir = "."
cmake.build-type = "Release"
build-dir        = "build/skbuild/{wheel_tag}"
wheel.packages   = ["python/ovrpy"]
wheel.install-dir = "ovrpy"
# Restrict what ends up in the wheel to OUR install rules (renderlib,
# rendercommon, _core, imgui, glad, OSPRay closure). Without this scope,
# FetchContent-pulled deps (glfw3, glad's own install rules, OSPRay's
# cmake config) would leak their files into the wheel and the install
# step would fail trying to rewrite RPATHs on third-party binaries.
install.components = ["ovrwheel"]

[tool.scikit-build.cmake.define]
OVR_BUILD_PYTHON_BINDINGS = "ON"
OVR_BUILD_APPS            = "ON"
OVR_BUILD_TESTS           = "OFF"

# ---------------------------------------------------------------------------
# pytest config. Lives here (rather than tests/pytest.ini) so the markers
# below are registered regardless of which directory pytest is invoked
# from; the cwd-relative discovery of `tests/pytest.ini` was fragile.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "gpu: backend variant runs on the GPU (optix7); skip with `pytest -m \"not gpu\"`",
    "cpu: backend variant runs on the CPU (ospray); skip with `pytest -m \"not cpu\"`",
    "slow: test renders many samples; skip for a fast CI loop",
    "golden: rendering regression against committed baseline PNG",
]

addopts = [
    "--strict-markers",
    "-ra",
    # Use Python's stdlib traceback instead of pytest's source-parsing one.
    # pytest's default `--tb=long` calls ast.parse() on the failing source,
    # and any Python garbage collection that runs during that parse ends up
    # executing C-extension destructors (OSPRay/OptiX/CUDA buffers); a
    # double-free or late CUDA context teardown inside one of those can
    # segfault the whole interpreter. --tb=native sidesteps it by formatting
    # tracebacks without re-parsing source code.
    "--tb=native",
]
