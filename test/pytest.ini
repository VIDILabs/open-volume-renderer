[pytest]
testpaths = python
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers. The CTest wrapper invokes pytest without filtering; use
# `pytest -m "not slow"` locally to skip the expensive path-tracing tests.
markers =
    gpu: backend variant runs on the GPU (optix7); skip with `pytest -m "not gpu"`
    cpu: backend variant runs on the CPU (ospray); skip with `pytest -m "not cpu"`
    slow: test renders many samples; skip for a fast CI loop
    golden: rendering regression against committed baseline PNG

addopts =
    --strict-markers
    -ra
    # Use Python's stdlib traceback instead of pytest's source-parsing one.
    # pytest's default `--tb=long` calls ast.parse() on the failing source,
    # and any Python garbage collection that runs during that parse ends up
    # executing C-extension destructors (OSPRay/OptiX/CUDA buffers); a
    # double-free or late CUDA context teardown inside one of those can
    # segfault the whole interpreter. --tb=native sidesteps it by formatting
    # tracebacks without re-parsing source code.
    --tb=native
