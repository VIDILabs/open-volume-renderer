name: CI

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # `CUDAARCHS` initialises CMAKE_CUDA_ARCHITECTURES on first configure
  # (CMake >= 3.20). Single source of truth for SM target across all jobs;
  # change here to retarget the whole workflow.
  CUDAARCHS: "86"

on:
  push:
    branches: [main, master, public]
  pull_request:
    branches: [main, master, public]

concurrency:
  group: ${{ github.workflow }}:${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-linux:
    name: linux (CUDA ${{ matrix.cuda_version }} Ubuntu ${{ matrix.ubuntu_version }} OSPRay ${{ matrix.ospray_mode }})
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_version: "11.8.0"
            ubuntu_version: "22.04"
            ospray_mode: fetchcontent
          - cuda_version: "11.8.0"
            ubuntu_version: "22.04"
            ospray_mode: external
          - cuda_version: "12.8.1"
            ubuntu_version: "24.04"
            ospray_mode: fetchcontent
          - cuda_version: "12.8.1"
            ubuntu_version: "24.04"
            ospray_mode: external
    env:
      BUILD_DIR: build
      CONFIG: Release

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc \
            g++ \
            libtbb-dev \
            libglfw3-dev \
            xorg-dev \
            wget

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.34
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda_version }}
          method: network

      - name: Install external OSPRay archive
        if: matrix.ospray_mode == 'external'
        shell: bash
        run: |
          OSPRAY_URL="https://github.com/wilsonCernWq/ospray/releases/download/sparse_sampling_v2.11.0/ospray-2.11.0.x86_64.linux_sparse_sampling.tar.gz"
          OSPRAY_ROOT="$RUNNER_TEMP/ospray-2.11.0.x86_64.linux_sparse_sampling"

          wget -O "$RUNNER_TEMP/ospray.tar.gz" "$OSPRAY_URL"
          tar -xzf "$RUNNER_TEMP/ospray.tar.gz" -C "$RUNNER_TEMP"

          echo "OSPRAY_DIR=$OSPRAY_ROOT/lib/cmake/ospray-2.11.0" >> "$GITHUB_ENV"

      - name: Set up Python (for pytest)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-xdist pytest-cov numpy pillow scikit-image

      - name: Configure
        shell: bash
        # OVR_BUILD_TESTS=ON now hard-requires Python3 + pytest + ovrpy at
        # configure time. The "Install Python test dependencies" step
        # above is what satisfies the pytest probe; if pytest isn't
        # importable when cmake runs, configure exits non-zero with a
        # clear install instruction.
        run: |
          CMAKE_ARGS=(
            -DCMAKE_BUILD_TYPE="${CONFIG}"
            -DOVR_BUILD_DEVICE_OPTIX7=ON
            -DOVR_BUILD_DEVICE_OSPRAY=ON
            -DOVR_BUILD_TESTS=ON
            -DOVR_BUILD_PYTHON_BINDINGS=ON
            -DCMAKE_CUDA_ARCHITECTURES="${CUDAARCHS}"
          )

          if [[ "${{ matrix.ospray_mode }}" == "external" ]]; then
            CMAKE_ARGS+=("-Dospray_DIR=${OSPRAY_DIR}")
          fi

          cmake -S . -B "${BUILD_DIR}" "${CMAKE_ARGS[@]}"

      - name: Build
        run: cmake --build "${BUILD_DIR}" --target all --verbose -j"$(nproc)"

      - name: Run CTest (C++ tier, CPU only)
        shell: bash
        # GHA runners have no NVIDIA GPU. The `gpu` CTest label excludes
        # C++/CUDA tests that require a device. We also skip the
        # `python_tests` entry here so its output isn't interleaved with
        # C++ output and so we can drive pytest with the `gpu` marker
        # filter directly in the next step.
        run: |
          ctest --test-dir "${BUILD_DIR}" --output-on-failure -LE gpu \
                --no-tests=error -E "python_tests"

      - name: Run pytest (Python tier, CPU only)
        shell: bash
        # `-m "not gpu"` deselects the `[optix7]` parametrize variants
        # (tagged via `pytest.param("optix7", marks=pytest.mark.gpu)` in
        # test/conftest.py). Failures here MUST fail the job - swallowing
        # them with `|| echo ...` previously made the entire Python tier
        # advisory and let golden-image regressions ship unnoticed.
        run: |
          OVR_BUILD_DIR="${PWD}/${BUILD_DIR}" \
          OVR_TEST_FIXTURES="${PWD}/test/fixtures" \
          python -m pytest test/python/ -m "not gpu" -v --color=yes

  build-windows:
    name: windows (CUDA ${{ matrix.cuda_version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_version: "12.8.1"
    env:
      BUILD_DIR: build
      CONFIG: Release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install oneTBB
        shell: pwsh
        run: |
          $tbbVersion = "2021.9.0"
          $tbbArchive = Join-Path $env:RUNNER_TEMP "oneapi-tbb-win.zip"
          $tbbRoot = Join-Path $env:RUNNER_TEMP "oneapi-tbb-$tbbVersion"

          Invoke-WebRequest -Uri "https://github.com/oneapi-src/oneTBB/releases/download/v$tbbVersion/oneapi-tbb-$tbbVersion-win.zip" -OutFile $tbbArchive
          Expand-Archive -Path $tbbArchive -DestinationPath $env:RUNNER_TEMP -Force

          "TBB_DIR=$tbbRoot/lib/cmake/tbb" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.34
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda_version }}
          method: network

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", $env:BUILD_DIR,
            "-DCMAKE_BUILD_TYPE=$env:CONFIG",
            "-DOVR_BUILD_DEVICE_OPTIX7=ON",
            "-DOVR_BUILD_DEVICE_OSPRAY=ON",
            "-DTBB_DIR=$env:TBB_DIR",
            "-DOVR_BUILD_TESTS=ON",
            "-DCMAKE_CUDA_ARCHITECTURES=${env:CUDAARCHS}"
          )
          cmake @cmakeArgs

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config $env:CONFIG --target ALL_BUILD --verbose

      - name: Run CTest (CPU only)
        shell: pwsh
        run: ctest --test-dir $env:BUILD_DIR -C $env:CONFIG --output-on-failure -LE gpu --no-tests=error

  coverage-linux:
    name: coverage (CPU + Python, Debug)
    runs-on: ubuntu-22.04
    env:
      BUILD_DIR: build
      CONFIG: Debug

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libtbb-dev libglfw3-dev xorg-dev wget

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.34
        with:
          cuda: "12.8.1"
          method: network

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python test deps + coverage tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-xdist pytest-cov numpy pillow scikit-image gcovr

      - name: Configure with coverage
        run: |
          cmake -S . -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOVR_BUILD_TESTS=ON \
            -DOVR_BUILD_PYTHON_BINDINGS=ON \
            -DOVR_ENABLE_COVERAGE=ON \
            -DOVR_BUILD_DEVICE_OPTIX7=ON \
            -DOVR_BUILD_DEVICE_OSPRAY=ON \
            -DCMAKE_CUDA_ARCHITECTURES="${CUDAARCHS}"

      - name: Build
        run: cmake --build "${BUILD_DIR}" --target all --verbose -j"$(nproc)"

      - name: Run tests + collect coverage via the `coverage` target
        env:
          # GHA runners have no GPU. C++ side: gpu-labelled tests already
          # auto-skip via the `gpu_available` CTest fixture (gpu_probe
          # exits non-zero when cudaGetDeviceCount() <= 0). Python side:
          # pytest doesn't auto-skip - we deselect the `[optix7]`
          # parametrize variants explicitly via PYTEST_ADDOPTS, which
          # pytest splices in front of its own argv.
          PYTEST_ADDOPTS: -m "not gpu"
        run: |
          cmake --build "${BUILD_DIR}" --target coverage
          ls -la "${BUILD_DIR}/coverage" || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            ${{ env.BUILD_DIR }}/coverage/coverage.xml
            ${{ env.BUILD_DIR }}/coverage/coverage-py.xml
            ${{ env.BUILD_DIR }}/coverage/index.html
          if-no-files-found: ignore
